    // ====== Копирование ======
    let toastTimer = null;

    function showToast(msg) {
        const t = document.getElementById("toast");
        if (!t) return;
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1400);
    }

    function copyText(text) {
        const ok = function () { showToast(tr("copied")); };
        const fail = function () { showToast(tr("copy_failed")); };
        const legacy = function () {
            try {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.cssText = "position:fixed;left:-1000px;top:0;opacity:0;user-select:text;";
                document.body.appendChild(ta);
                ta.select();
                const done = document.execCommand("copy");
                document.body.removeChild(ta);
                if (done) ok(); else fail();
            } catch (e) { fail(); }
        };
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(ok, legacy);
                return;
            }
        } catch (e) {}
        legacy();
    }

    function copyDisplay() {
        if (errorMsg) return;
        copyText(displayEl.textContent);
    }

    // Расчёт целиком: "12 + 30 = 42"
    function copyFull() {
        if (errorMsg) return;
        if (isEvaluated && doneExpr) {
            copyText(fmt(doneExpr) + " = " + fmt(cur));
        } else {
            const t = fmt((expr + (typing ? cur : "")).trim());
            copyText(t || fmt(cur));
        }
    }

    // ====== Конвертер ======
    let currentCategory = "length";
    let convInputVal = "0";

    // f - сколько базовых единиц в одной единице; def - какие единицы выбраны сразу;
    // l - подпись по-русски, e - по-английски (если не указана, одинаковая)

        length: { def: [2, 3], units: [
            { k: "mm", l: "мм", e: "mm", f: 0.001 }, { k: "cm", l: "см", e: "cm", f: 0.01 },
            { k: "m", l: "м", e: "m", f: 1 }, { k: "km", l: "км", e: "km", f: 1000 },
            { k: "in", l: "дюйм", e: "in", f: 0.0254 }, { k: "ft", l: "фут", e: "ft", f: 0.3048 },
            { k: "yd", l: "ярд", e: "yd", f: 0.9144 }, { k: "mi", l: "миля", e: "mi", f: 1609.344 } ] },
        temp: { def: [0, 1], units: [
            { k: "c", l: "°C" }, { k: "f", l: "°F" }, { k: "k", l: "K" } ] },
        weight: { def: [2, 4], units: [
            { k: "mg", l: "мг", e: "mg", f: 0.000001 }, { k: "g", l: "г", e: "g", f: 0.001 },
            { k: "kg", l: "кг", e: "kg", f: 1 }, { k: "t", l: "т", e: "t", f: 1000 },
            { k: "lb", l: "фунт", e: "lb", f: 0.45359237 }, { k: "oz", l: "унция", e: "oz", f: 0.028349523125 } ] },
        volume: { def: [1, 0], units: [
            { k: "ml", l: "мл", e: "ml", f: 0.001 }, { k: "l", l: "л", e: "l", f: 1 },
            { k: "m3", l: "м³", e: "m³", f: 1000 }, { k: "gal", l: "галлон", e: "gal", f: 3.785411784 } ] },
        data: { def: [3, 2], units: [
            { k: "b", l: "Б", e: "B", f: 1 }, { k: "kb", l: "КБ", e: "KB", f: 1024 },
            { k: "mb", l: "МБ", e: "MB", f: 1048576 }, { k: "gb", l: "ГБ", e: "GB", f: 1073741824 },
            { k: "tb", l: "ТБ", e: "TB", f: 1099511627776 } ] },
        speed: { def: [1, 2], units: [

        time: { def: [2, 1], units: [
            { k: "s", l: "сек", e: "sec", f: 1 }, { k: "min", l: "мин", e: "min", f: 60 },
            { k: "h", l: "час", e: "hr", f: 3600 }, { k: "day", l: "сут", e: "day", f: 86400 },
            { k: "wk", l: "нед", e: "wk", f: 604800 } ] },
        area: { def: [0, 2], units: [
            { k: "m2", l: "м²", e: "m²", f: 1 }, { k: "km2", l: "км²", e: "km²", f: 1000000 },
            { k: "ha", l: "га", e: "ha", f: 10000 }, { k: "acre", l: "акр", e: "acre", f: 4046.8564224 } ] }
    };

    const unitFrom = document.getElementById("unit-from");
    const unitTo = document.getElementById("unit-to");
    const tipsExtra = document.getElementById("tips-extra");
    const tipsPercent = document.getElementById("tips-percent");
    const tipsPersons = document.getElementById("tips-persons");

    function unitLabel(u) {
        return settings.lang === "en" && u.e ? u.e : u.l;
    }

    // Меняет подписи в выпадающих списках при смене языка, не трогая выбор
    function refreshUnitLabels() {
        if (currentCategory === "tips") {
            if (unitFrom.options[0]) unitFrom.options[0].text = tr("bill");
            const keys = ["tip_total", "tip_amount", "tip_per_guest"];
            keys.forEach(function (k, i) { if (unitTo.options[i]) unitTo.options[i].text = tr(k); });
        } else {
            const list = unitsData[currentCategory].units;
            list.forEach(function (u, i) {
                if (unitFrom.options[i]) unitFrom.options[i].text = unitLabel(u);
                if (unitTo.options[i]) unitTo.options[i].text = unitLabel(u);
            });
        }
    }

    // ====== Конвертер: дни между датами (категория "Время") ======
    let timeMode = "units";

    function datesActive() {
        return currentCategory === "time" && timeMode === "dates";
    }

    const WORDS = {
        day: { ru: ["день", "дня", "дней"], en: ["day", "days"] },
        week: { ru: ["неделя", "недели", "недель"], en: ["week", "weeks"] },
        month: { ru: ["месяц", "месяца", "месяцев"], en: ["month", "months"] },
        year: { ru: ["год", "года", "лет"], en: ["year", "years"] }
    };

    function word(kind, n) {
        n = Math.abs(n);
        if (settings.lang === "en") return WORDS[kind].en[n === 1 ? 0 : 1];
        const f = WORDS[kind].ru;
        const m10 = n % 10, m100 = n % 100;
        if (m10 === 1 && m100 !== 11) return f[0];
        if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return f[1];
        return f[2];
    }

    function pad2(n) {
        return (n < 10 ? "0" : "") + n;
    }

    function todayStr() {
        const d = new Date();
        return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    }

    function setToday(id) {
        document.getElementById(id).value = todayStr();
        updateDateDiff();
    }

    function daysInMonth(y, m) {
        return new Date(Date.UTC(y, m, 0)).getUTCDate();
    }

    function parseDateStr(s) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
        return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
    }

    // Разница между датами: всего дней (со знаком) и разбивка на годы, месяцы, дни
    function dateDiff(a, b) {
        const A = parseDateStr(a), B = parseDateStr(b);
        if (!A || !B) return null;
        const days = Math.round((Date.UTC(B.y, B.m - 1, B.d) - Date.UTC(A.y, A.m - 1, A.d)) / 86400000);
        const s = days < 0 ? B : A;
        const e = days < 0 ? A : B;
        let years = e.y - s.y, months = e.m - s.m, d = e.d - s.d;
        let my = e.y, mm = e.m;
        while (d < 0) {
            mm--;
            if (mm < 1) { mm = 12; my--; }
            d += daysInMonth(my, mm);
            months--;
        }
        while (months < 0) { months += 12; years--; }
        const abs = Math.abs(days);
        return { days: days, years: years, months: months, restDays: d, weeks: Math.floor(abs / 7), weekDays: abs % 7 };
    }

    function dateResultText() {
        const r = dateDiff(document.getElementById("date-from").value, document.getElementById("date-to").value);
        if (!r) return "";
        return r.days + " " + word("day", r.days);
    }

    function updateDateDiff() {
        const daysEl = document.getElementById("date-days");
        const brEl = document.getElementById("date-breakdown");
        const wkEl = document.getElementById("date-weeks");
        const hintEl = document.getElementById("date-hint");
        const r = dateDiff(document.getElementById("date-from").value, document.getElementById("date-to").value);
        if (!r) {
            daysEl.textContent = "—";
            brEl.textContent = "";
            wkEl.textContent = "";
            hintEl.textContent = "";
            return;
        }
        daysEl.textContent = r.days + " " + word("day", r.days);
        const parts = [];
        if (r.years) parts.push(r.years + " " + word("year", r.years));
        if (r.months) parts.push(r.months + " " + word("month", r.months));
        if (r.restDays) parts.push(r.restDays + " " + word("day", r.restDays));
        brEl.textContent = (r.years || r.months) ? parts.join(" ") : "";
        let w = "";
        if (r.weeks) {
            w = r.weeks + " " + word("week", r.weeks);
            if (r.weekDays) w += " " + r.weekDays + " " + word("day", r.weekDays);
        }
        wkEl.textContent = w;
        hintEl.textContent = r.days < 0 ? tr("date_back") : "";
    }

    function copyDates() {
        const t = dateResultText();
        if (!t) return;
        const br = document.getElementById("date-breakdown").textContent;
        copyText(br && br !== t ? t + " (" + br + ")" : t);
    }

    function applyTimeMode() {

        converterPanel.classList.toggle("is-tips", currentCategory === "tips");

        document.querySelectorAll("#time-mode button").forEach(function (b) {

    function setTimeMode(m) {

    function setCategory(cat) {

    function convInput(ch) {
        if (datesActive()) return;
        if (ch === "," || ch === ".") {
            if (convInputVal.includes(".")) return;
            convInputVal += ".";
        } else if (convInputVal === "0") {
            convInputVal = ch;
        } else if (convInputVal === "-0") {
            convInputVal = "-" + ch;
        } else if (digitCount(convInputVal) < 12) {
            convInputVal += ch;
        }
        convertUnits();
    }

    function convDel() {
        if (datesActive()) return;
        if (convInputVal.length <= 1 || (convInputVal.length === 2 && convInputVal.startsWith("-"))) {
            convInputVal = "0";
        } else {
            convInputVal = convInputVal.slice(0, -1);
        }
        convertUnits();
    }

    function convToggleSign() {
        if (datesActive()) return;
        convInputVal = convInputVal.startsWith("-") ? convInputVal.slice(1) : "-" + convInputVal;
        convertUnits();
    }

    function formatConv(r, money) {
        if (!isFinite(r)) return "0";
        if (money) return r.toFixed(2);
        return String(parseFloat(r.toPrecision(14)));
    }

    function convertUnits() {
        const val = parseFloat(convInputVal) || 0;
        document.getElementById("conv-val-1").textContent = fmt(convInputVal);

        const fromU = unitFrom.value;
        const toU = unitTo.value;
        let result = val;
        let money = false;

        if (currentCategory === "temp") {
            let inC = val;
            if (fromU === "f") inC = (val - 32) * 5 / 9;
            if (fromU === "k") inC = val - 273.15;
            if (toU === "c") result = inC;
            if (toU === "f") result = inC * 9 / 5 + 32;
            if (toU === "k") result = inC + 273.15;
        } else if (currentCategory === "tips") {
            money = true;
            const rate = (parseFloat(tipsPercent.value) || 0) / 100;
            const persons = parseInt(tipsPersons.value, 10) || 1;
            const tip = val * rate;
            const total = val + tip;
            if (toU === "tip") result = tip;
            else if (toU === "per_person") result = total / persons;
            else result = total;
        } else {
            const list = unitsData[currentCategory].units;
            const fu = list.find(function (u) { return u.k === fromU; });
            const tu = list.find(function (u) { return u.k === toU; });
            if (fu && tu) result = val * fu.f / tu.f;
        }

        document.getElementById("conv-val-2").textContent = fmt(formatConv(result, money));
    }

    unitFrom.addEventListener("change", convertUnits);
    unitTo.addEventListener("change", convertUnits);
    tipsPercent.addEventListener("change", convertUnits);
    tipsPersons.addEventListener("change", convertUnits);

    // ====== Язык ======
    function applyLanguage() {
        document.documentElement.lang = settings.lang;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
            el.textContent = tr(el.dataset.i18n);
        });
        document.querySelectorAll("[data-i18n-title]").forEach(function (el) {
            el.title = tr(el.dataset.i18nTitle);
        });
        document.querySelectorAll(".dec-key").forEach(function (el) {
            el.textContent = settings.lang === "en" ? "." : ",";
        });
        refreshUnitLabels();
        refreshSciLabels();
        updateDateDiff();
        renderHistory();
        updateDisplay();
        convertUnits();
    }

    // ====== Тема, цвет, фон ======
    function hexToHsl(hex) {
        const r = parseInt(hex.slice(1, 3), 16) / 255;
        const g = parseInt(hex.slice(3, 5), 16) / 255;
        const b = parseInt(hex.slice(5, 7), 16) / 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const l = (max + min) / 2;
        let h = 0, s = 0;
        if (max !== min) {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
        }
        return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function resolvedTheme() {
        if (settings.theme === "auto") {
            const light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
            return light ? "light" : "dark";
        }
        return settings.theme === "light" ? "light" : "dark";
    }

    function applyAppearance() {
        const root = document.documentElement;
        const theme = resolvedTheme();
        root.setAttribute("data-theme", theme);

        // Цвет акцента и производные от него оттенки
        const hex = settings.accent;
        const c = hexToHsl(hex);
        const set = function (k, v) { root.style.setProperty(k, v); };
        set("--accent-color", hex);
        set("--accent-hover", "hsl(" + c.h + " " + Math.min(100, c.s + 8) + "% " + Math.min(88, c.l + 8) + "%)");
        set("--accent-active", "hsl(" + c.h + " " + c.s + "% " + Math.max(10, c.l - 8) + "%)");
        const funcL = theme === "light" ? Math.max(20, Math.min(c.l, 46)) : Math.min(78, Math.max(c.l + 12, 58));
        set("--btn-func-color", "hsl(" + c.h + " " + Math.min(100, c.s + 6) + "% " + funcL + "%)");
        const lum = 0.299 * parseInt(hex.slice(1, 3), 16) + 0.587 * parseInt(hex.slice(3, 5), 16) + 0.114 * parseInt(hex.slice(5, 7), 16);
        set("--on-accent", lum > 165 ? "#111114" : "#ffffff");

        // Свой фон с затемнением под цвет темы
        if (settings.bg) {
            const rgb = theme === "light" ? "243,244,248" : "0,0,0";
            const a = (settings.dim / 100).toFixed(2);
            calcEl.style.backgroundImage = "linear-gradient(rgba(" + rgb + "," + a + "),rgba(" + rgb + "," + a + ")), url(\"" + settings.bg + "\")";
            calcEl.classList.add("has-bg");
        } else {
            calcEl.style.backgroundImage = "";
            calcEl.classList.remove("has-bg");
        }

        // Прозрачность панелей (история, конвертер, настройки) и кнопок
        const pa = (100 - settings.panelT) / 100;
        set("--panel-a", pa.toFixed(2));
        set("--panel-a-set", Math.max(pa, 0.6).toFixed(2));
        set("--btn-pct", (100 - settings.btnT) + "%");
        calcEl.classList.toggle("btn-glass", settings.btnT > 0);
        syncSettingsUI();
    }

    function syncSettingsUI() {
        document.querySelectorAll("#seg-lang button").forEach(function (b) {
            b.classList.toggle("active", b.dataset.val === settings.lang);
        });
        document.querySelectorAll("#seg-theme button").forEach(function (b) {
            b.classList.toggle("active", b.dataset.val === settings.theme);
        });
        document.querySelectorAll("#swatches .swatch").forEach(function (b) {
            b.classList.toggle("active", b.dataset.val.toLowerCase() === settings.accent.toLowerCase());
        });
        const custom = document.getElementById("accent-custom");
        if (custom) custom.value = settings.accent;
        const dim = document.getElementById("bg-dim");
        if (dim) dim.value = settings.dim;
        const dimVal = document.getElementById("bg-dim-val");
        if (dimVal) dimVal.textContent = settings.dim + "%";
        const pt = document.getElementById("panel-t");
        if (pt) pt.value = settings.panelT;
        const ptv = document.getElementById("panel-t-val");
        if (ptv) ptv.textContent = settings.panelT + "%";
        const bt = document.getElementById("btn-t");
        if (bt) bt.value = settings.btnT;
        const btv = document.getElementById("btn-t-val");
        if (btv) btv.textContent = settings.btnT + "%";
        const ot = document.getElementById("set-ontop");
        if (ot) {
            ot.classList.toggle("on", !!settings.onTop);
            ot.setAttribute("aria-checked", settings.onTop ? "true" : "false");
        }
    }

    // ====== Сохранение настроек ======
    // Основное хранилище - файл через Python (settings.json); в обычном браузере - localStorage
    // В файл (через Python) пишем не чаще раза в четверть секунды: ползунки шлют
    // десятки событий подряд, и каждое запускало бы отдельную запись файла
    let saveTimer = null;
    function saveSettings() {
        const txt = JSON.stringify(settings);
        try { localStorage.setItem(STORE_KEY, txt); } catch (e) {}
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () { callApi("save_settings", txt); }, 250);
    }

    function loadSettingsFrom(txt) {
        let d;
        try { d = JSON.parse(txt); } catch (e) { return; }
        if (!d || typeof d !== "object") return;
        if (d.lang === "ru" || d.lang === "en") settings.lang = d.lang;
        if (d.theme === "dark" || d.theme === "light" || d.theme === "auto") settings.theme = d.theme;
        if (typeof d.accent === "string" && /^#[0-9a-f]{6}$/i.test(d.accent)) settings.accent = d.accent;
        if (typeof d.bg === "string" && /^data:image\/(?:jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(d.bg)) settings.bg = d.bg;
        else if (d.bg === null) settings.bg = null;
        if (typeof d.dim === "number" && d.dim >= 0 && d.dim <= 85) settings.dim = Math.round(d.dim);
        if (typeof d.panelT === "number" && d.panelT >= 0 && d.panelT <= 85) settings.panelT = Math.round(d.panelT);
        if (typeof d.btnT === "number" && d.btnT >= 0 && d.btnT <= 80) settings.btnT = Math.round(d.btnT);
        if (typeof d.onTop === "boolean") settings.onTop = d.onTop;
        if (typeof d.sci === "boolean") settings.sci = d.sci;
        if (typeof d.deg === "boolean") settings.deg = d.deg;
        applyLanguage();
        applyAppearance();
        applySci();
    }

    function changeSetting(key, value) {
        settings[key] = value;
        if (key === "lang") applyLanguage();
        applyAppearance();
        if (key === "onTop") callApi("set_on_top", !!value);
        saveSettings();
    }

    // Картинка уменьшается до 1280 px, чтобы файл настроек был небольшим
    function setBackgroundFromFile(file) {
        if (!file || !/^image\//.test(file.type)) return;
        const reader = new FileReader();
        reader.onload = function () {
            const img = new Image();
            img.onload = function () {
                const sc = Math.min(1, 1280 / Math.max(img.width, img.height));
                const w = Math.max(1, Math.round(img.width * sc));
                const h = Math.max(1, Math.round(img.height * sc));
                const cv = document.createElement("canvas");
                cv.width = w;
                cv.height = h;
                cv.getContext("2d").drawImage(img, 0, 0, w, h);
                if (settings.btnT === 0) settings.btnT = 35;
                changeSetting("bg", cv.toDataURL("image/jpeg", 0.85));
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    }

    function setupSettingsUI() {
        document.querySelectorAll("#seg-lang button").forEach(function (b) {
            b.onclick = function () { changeSetting("lang", b.dataset.val); };
        });
        document.querySelectorAll("#seg-theme button").forEach(function (b) {
            b.onclick = function () { changeSetting("theme", b.dataset.val); };
        });
        const box = document.getElementById("swatches");
        SWATCHES.forEach(function (hex) {
            const b = document.createElement("button");
            b.className = "swatch";
            b.dataset.val = hex;
            b.style.backgroundColor = hex;
            b.onclick = function () { changeSetting("accent", hex); };
            const label = typeof box.querySelector === "function" ? box.querySelector(".custom-color") : null;
            if (label) box.insertBefore(b, label);
            else box.appendChild(b);
        });
        document.getElementById("accent-custom").addEventListener("input", function (e) {
            changeSetting("accent", e.target.value);
        });
        const file = document.getElementById("bg-file");
        document.getElementById("bg-pick").onclick = function () { file.click(); };
        file.addEventListener("change", function (e) {
            const f = e.target.files && e.target.files[0];
            if (f) setBackgroundFromFile(f);
            e.target.value = "";
        });
        document.getElementById("bg-clear").onclick = function () { changeSetting("bg", null); };
        document.getElementById("panel-t").addEventListener("input", function (e) {
            changeSetting("panelT", parseInt(e.target.value, 10));
        });
        document.getElementById("btn-t").addEventListener("input", function (e) {
            changeSetting("btnT", parseInt(e.target.value, 10));
        });
        document.getElementById("set-ontop").onclick = function () { changeSetting("onTop", !settings.onTop); };
        document.getElementById("bg-dim").addEventListener("input", function (e) {
            changeSetting("dim", parseInt(e.target.value, 10));
        });
        document.getElementById("settings-reset").onclick = function () {
            settings = Object.assign({}, DEFAULTS);
            applyLanguage();
            applyAppearance();
            applySci();
            syncWindowSize();
            callApi("set_on_top", false);
            saveSettings();
        };
    }

    // Перетаскивание картинки в окно ставит её фоном (и не даёт окну "уехать" на файл)
    window.addEventListener("dragover", function (e) { e.preventDefault(); });
    window.addEventListener("drop", function (e) {
        e.preventDefault();
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) setBackgroundFromFile(f);
    });

    if (window.matchMedia) {
        try {
            window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", function () {
                if (settings.theme === "auto") applyAppearance();
            });
        } catch (e) {}
    }

    // ====== Клавиатура и фокус ======
    // После клика кнопка теряет фокус, иначе Enter "нажмёт" её ещё раз
    document.addEventListener("click", function (e) {
        const b = e.target && e.target.closest ? e.target.closest("button") : null;
        if (b) b.blur();
    });
    document.addEventListener("change", function (e) {
        if (e.target && e.target.tagName === "SELECT") e.target.blur();
    });

    document.addEventListener("keydown", function (e) {
        if (e.target && (e.target.tagName === "SELECT" || e.target.tagName === "INPUT")) return;
        // Ctrl+C копирует результат, Ctrl+Shift+C весь расчёт
        if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "c" || e.key === "C")) {
            if (converterPanel.classList.contains("open")) {
                if (datesActive()) copyDates(); else copyConv(2);
            } else if (e.shiftKey) {
                copyFull();
            } else {
                copyDisplay();
            }
            e.preventDefault();
            return;
        }
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const k = e.key;
        let handled = true;

        if (settingsPanel.classList.contains("open")) {
            if (k === "Escape") {
                settingsPanel.classList.remove("open");
                e.preventDefault();
            }
            return;
        }

        if (converterPanel.classList.contains("open")) {
            if (/^[0-9]$/.test(k)) convInput(k);
            else if (k === "." || k === ",") convInput(".");
            else if (k === "-") convToggleSign();
            else if (k === "Backspace") convDel();
            else if (k === "Escape") converterPanel.classList.remove("open");
            else handled = false;
            if (handled) e.preventDefault();
            return;
        }

        if (historyPanel.classList.contains("open") && k === "Escape") {
            setHistoryOpen(false);
            e.preventDefault();
            return;
        }

        if (/^[0-9]$/.test(k)) appendValue(k);
        else if (k === "." || k === ",") appendValue(".");
        else if (k === "+") appendOp("+");
        else if (k === "-") appendOp("−");
        else if (k === "*" || k === "x" || k === "X") appendOp("×");
        else if (k === "/") appendOp("÷");
        else if (k === "%") percent();
        else if (k === "^") appendOp("^");
        else if (k === "!") postfix("!");
        else if (k === "(" || k === ")") parenSmart();
        else if (k === "Enter" || k === "=") calculate();
        else if (k === "Backspace") deleteChar();
        else if (k === "Escape" || k === "Delete") clearAll();
        else handled = false;
        if (handled) e.preventDefault();
    });

    window.addEventListener("resize", fitDisplay);

    // Старые браузеры без dvh: высота видимой области берётся из window.innerHeight
    if (!(window.CSS && CSS.supports && CSS.supports("height", "100dvh"))) {
        const setVh = function () {
            if (window.innerHeight) document.documentElement.style.setProperty("--vh", window.innerHeight + "px");
        };
        setVh();
        window.addEventListener("resize", setVh);
    }

    // ====== Старт ======
    setupSettingsUI();
    setupDatesUI();
    document.getElementById("sci-toggle").onclick = toggleSci;
    try {
        const saved = localStorage.getItem(STORE_KEY);
        if (saved) loadSettingsFrom(saved);
        const savedHist = localStorage.getItem(HISTORY_KEY);
        if (savedHist) loadHistoryFrom(savedHist);
    } catch (e) {}
    setCategory("length");
    applyLanguage();
    applyAppearance();
    applySci();

    // Внутри программы настройки и история лежат в файлах, которые отдаёт Python
    let pyInitDone = false;
    function initFromPython() {
        if (pyInitDone) return;
        if (!(window.pywebview && window.pywebview.api && window.pywebview.api.load_settings)) return;
        pyInitDone = true;
        // Сообщаем Python, что страница загрузилась: только после этого он трогает окно
        setTimeout(function () { callApi("notify_ready"); }, 300);
        try {
            window.pywebview.api.load_settings().then(function (txt) {
                if (txt) loadSettingsFrom(txt);
                // Окно создаётся обычным вертикальным и не закреплённым: Python дёргаем,
                // только если нужно иначе (иначе лишние вызовы на старте)
                if (settings.sci) syncWindowSize();
                if (settings.onTop) callApi("set_on_top", true);
            }).catch(function () {});
            window.pywebview.api.load_history().then(function (txt) {
                if (txt) loadHistoryFrom(txt);
            }).catch(function () {});
        } catch (e) {}
    }
    window.addEventListener("pywebviewready", initFromPython);
    window.addEventListener("load", initFromPython);
    initFromPython();
</script>
</body>
</html>
